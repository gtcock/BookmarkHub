name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build extension
        run: npm run zip

      - name: Rename zip for release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp .output/bookmarkhub-${VERSION}-chrome.zip .output/bookmarkhub-chrome.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookmarkhub-chrome
          path: .output/bookmarkhub-chrome.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: .output/bookmarkhub-chrome.zip
          body: |
            ## 📦 安装方法

            ### Chrome / Edge / 其他 Chromium 内核浏览器

            1. 下载下方的 `bookmarkhub-chrome.zip` 文件
            2. 解压到任意文件夹
            3. 打开浏览器，进入扩展管理页面：
               - Chrome: `chrome://extensions/`
               - Edge: `edge://extensions/`
            4. 开启右上角的「开发者模式」
            5. 点击「加载已解压的扩展程序」
            6. 选择解压后的文件夹
            7. 完成！点击扩展图标开始使用

            ### Firefox

            请从 [Firefox 附加组件商店](https://addons.mozilla.org/zh-CN/firefox/addon/BookmarkHub/) 安装。

            ---

            📖 详细使用说明请查看 [README](https://github.com/iwvw/BookmarkHub#readme)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Latest Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          files: .output/bookmarkhub-chrome.zip
          prerelease: true
          body: |
            ## 📦 最新开发构建

            ⚠️ 这是自动构建的预发布版本，可能包含未完成的功能。

            ### 安装方法

            1. 下载下方的 `bookmarkhub-chrome.zip` 文件
            2. 解压到任意文件夹
            3. 打开浏览器扩展页面（`chrome://extensions/` 或 `edge://extensions/`）
            4. 开启「开发者模式」
            5. 点击「加载已解压的扩展程序」，选择解压后的文件夹
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
